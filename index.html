<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Palmascorinto · Avance de obra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Palmascorinto</h1>
    <span class="subtitle">Evidencias y avance de obra</span>
  </header>

  <main>
    <section class="panel">
      <h2 id="project-name">Proyecto</h2>
      <p id="project-desc" class="muted"></p>
      <div class="overall">
        <div class="overall-num"><span id="overall-pct">0%</span><small>avance general</small></div>
        <div class="overall-info">
          <div class="bar big"><div id="overall-bar" style="width:0%"></div></div>
          <p id="project-dates" class="muted"></p>
        </div>
      </div>
      <h3>Fases</h3>
      <ol id="phases" class="phases"></ol>
      <h3>Avance por área</h3>
      <div id="summary"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Registros</h2>
        <div class="filters">
          <select id="filter-area"><option value="">Todas las áreas</option></select>
          <select id="filter-kind">
            <option value="">Todo</option>
            <option value="evidencia">Evidencias</option>
            <option value="reporte">Reportes</option>
          </select>
        </div>
      </div>
      <div id="entries"></div>
    </section>
  </main>

  <script src="project.js"></script>
  <script src="app.js"></script>
</body>
</html>
